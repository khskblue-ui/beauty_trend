  launches:     {title: 신제품 트래커, core: true, min_items: 5}
  notes:        {title: 향 노트 픽, core: false, chart_min_n: 30}
  customers:    {title: 고객사 워치, core: false, hidden_without_customers: true}
  market:       {title: 시장 동향, core: true, min_items: 3}
  regulation:   {title: 규제·원료·경쟁사, core: true}
  signals:      {title: 영업 시그널, core: false, hidden_without_customers: true}
