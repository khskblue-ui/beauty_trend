# 0단계 프로브를 GitHub Actions 러너 IP에서 재실행해 차단 여부를 비교한다.
# 수동 실행 전용. 결과 JSON은 아티팩트로 내려받는다.
name: phase0-probe

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "web_probe 대상 키(공백 구분). 비우면 전체"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Web sources
        env:
          SOURCES: ${{ inputs.sources }}
        run: python scripts/probe/web_probe.py $SOURCES
      - name: EUR-Lex (CELLAR SPARQL)
        run: python scripts/probe/eurlex_probe.py
      - name: NAVER API HUB
        if: ${{ env.NAVER_CLIENT_ID != '' }}
        run: python scripts/probe/naver_probe.py
      - name: Gemini
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python scripts/probe/gemini_probe.py gemini-3.8-flash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-probe-out
          path: scripts/probe/out/
