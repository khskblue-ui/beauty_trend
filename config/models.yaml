# backend: session = 작업 세션의 Claude가 요청 파일에 답한다(trend/exchange.py, 외부 API 비용 없음, 2026-10-16 유지보수자 결정).
#          gemini  = Gemini API(예비). 되돌리려면 각 단계의 backend를 gemini로 바꾼다.
# role: verify 요청은 'verifier'로 시작하는 독립 서브에이전트만 답할 수 있다(쓴 쪽과 검증하는 쪽 분리).
# Gemini 모델 ID는 고정값으로 둔다(*-latest 별칭 금지). 단종 시 fallback으로 교체.
enrich:
  backend: session
  role: enrich
  model: gemini-3.8-flash
  fallback: gemini-3.5-flash
  thinking_budget: 512      # thinking 토큰이 출력 비용의 대부분 → 상한을 둔다
  max_retries: 2            # 스키마 위반 시 재시도 횟수(PLAN: 2회 후 폐기)
  # 2026-10 구글 결제서에서 역산한 실제 단가(입출력 합산 1천 토큰당 원). 정리 전 금액 추정에 쓴다.
  krw_per_1k_tokens: 1.9
  tokens_per_doc: 1100      # 2026-10 장부 평균(입력 약 850, 출력 약 240)
  confirm_over_krw: 3000    # 예상 금액이 이보다 크면 --yes 없이 돌리지 않는다(매일 수집은 보통 600~1,200원)
                            # --upgrade(이미 정리한 기사 다시 정리)는 금액과 상관없이 --yes가 있어야 돈다
write:
  backend: session
  role: write
  model: gemini-4-argon     # 2026-10-14 유지보수자 지정. 2026-12-01부터 단가 2배
  fallback: gemini-3.1-pro-preview
  thinking_budget: 2048
  max_retries: 2
verify:                     # 근거 함의 판정은 write와 다른 쪽(독립 서브에이전트)이 별도로
  backend: session
  role: verify
  model: gemini-3.8-flash
  fallback: gemini-3.5-flash
  thinking_budget: 256
  max_retries: 1
