# 리포트 문체 규칙 — 단일 출처. docs/style_guide.md에 사람용 설명이 있다.
#
# sentence_rules: 매달 LLM이 쓴 문장에 적용(trend/style.py).
#   걸린 문장은 write 모델이 고쳐 쓰고, 고친 문장도 근거 검증을 다시 거친다.
#   고친 뒤에도 남은 경고는 실행 기록과 유지보수자 메일에 남긴다.
# copy_banned: 템플릿 고정 문구(독자가 보는 글)에 쓰면 안 되는 말. tests/test_style.py가 검사.
#
# 새 어색한 표현을 발견하면 여기 한 줄 추가 → 다음 달부터 자동 반영.

sentence_rules:
  - id: hype
    pattern: '(기대된다|기대를 모|주목된다|주목받|눈길을 끈|귀추가|화제를 모|박차를 가|전망이다|것으로 보인다|평가된다|각광받|돌풍)'
    hint: 해석·전망·평가 표현을 빼고 사실만 쓴다.
  - id: promo
    pattern: '(혁신적|혁신 |독보적|차별화된|본연의|획기적|최고의|완벽한|독자 개발한 혁신)'
    hint: 보도자료의 홍보 수식어를 뺀다. 제품·회사가 한 일만 남긴다.
  - id: tonghae
    pattern: '(을|를) 통해'
    hint: "'~을 통해'를 '~로', '~해서', '~하며'로 바꾸거나 문장을 둘로 나눈다."
  - id: double_particle
    pattern: '(에서의|으로의|로의|에의|과의|와의|에게서의)'
    hint: 이중 조사를 풀어 쓴다(예 '천연 원료 분야에서의 입지' → '천연 원료 사업').
  - id: cliche_verb
    pattern: '(가속화|본격화|입지를 (강화|다지|굳히)|역량을 (강화|확대)|시너지|발판을 마련|포트폴리오를 강화)'
    hint: 상투적 동사를 구체적인 행동으로 바꾼다(무엇을 열었는지, 샀는지, 팔았는지).
  - id: hayeo
    pattern: '하여 '
    hint: "'~하여'를 '~해'로 쓴다."
  - id: mit
    pattern: ' 및 '
    hint: "'및' 대신 쉼표나 '~와/과'를 쓴다."
  - id: jasa
    pattern: '자사의'
    hint: "'자사의'는 빼거나 회사 이름으로 쓴다."
  - id: redundant
    pattern: '(최종 완료|양성하여 배출|공식적으로 공식|새롭게 신규|다시 재)'
    hint: 겹치는 말을 하나로 줄인다.
  - id: geot_natanatda
    pattern: '것으로 (나타났|알려졌|확인됐|집계됐|조사됐)'
    hint: "'~것으로 나타났다'를 '~했다/~이다'로 바로 쓴다."
  - id: passive_double
    pattern: '(되어지|되어졌|지게 되)'
    hint: 이중 피동을 능동이나 단순 피동으로 바꾼다.
  - id: translated_verb
    pattern: '(대화를 강화|리더십 회의를 소집|회의를 소집|에 대해 인증|를 진행했다|을 진행했다)'
    hint: 영어 직역 동사를 한국어 보도 문장으로 바꾼다(예 '회의를 소집했다' → '회의를 열었다').
  - id: jeogin_many
    count_pattern: '적인'
    max_count: 1
    hint: "'~적인'을 한 문장에 두 번 이상 쓰지 않는다."

# 독자가 보는 템플릿 문구에 쓰면 안 되는 말(개발 용어·번역체).
copy_banned:
  - 근거 카드
  - 엔티티
  - 함의
  - 클러스터
  - 품질 게이트
  - 드라이런
  - 검증을 통과한
  - 헤드라인급
  - 블로터
  - 커버리지
  - 기사 묶음
  - 근거 사건
  - 중복 묶음
  - 섹션별 첫 문장
  - 시료
  - 검출기
  - 질량 스펙트럼
  - 를 읽다
  - 펼쳤습니다
  - 솟은
  - 에서의
  - 을 통해
  - 를 통해
  - n=
