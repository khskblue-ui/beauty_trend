# 매일 수집 + enrich. 결과(본문 제외)는 data 브랜치에 커밋, 본문은 비공개 아티팩트.
name: collect-daily

on:
  schedule:
    - cron: "17 21 * * *"   # 06:17 KST
  workflow_dispatch:
    inputs:
      only:
        description: "소스 id(쉼표 구분). 비우면 전체"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATA_DIR: data
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/data-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml==6.0.1 jinja2==3.1.6
      - name: Collect
        env:
          ONLY: ${{ inputs.only }}
        # backfill: re-read the last 3 days of each source archive so a failed run
        # or a feed that rotates quickly does not lose articles (known ones are skipped)
        run: python -m trend collect ${ONLY:+--only "$ONLY"} --backfill-since "$(TZ=Asia/Seoul date -d '3 days ago' +%F)"
      - name: Enrich new documents
        run: python -m trend enrich
      - name: Upload article bodies (private, not committed)
        uses: actions/upload-artifact@v4
        with:
          name: bodies-${{ github.run_id }}
          path: data/private/
          retention-days: 90
          if-no-files-found: ignore
      - name: Commit data
        if: always()
        run: |
          cd data
          git add -A
          git diff --cached --quiet || git commit -qm "collect $(TZ=Asia/Seoul date +%F)"
          git push origin data
