customers: []   # 보류 항목: 수신자에게서 받기 전까지 비워 둠 → 관련 섹션 숨김
storage:
  # 저장소가 public인 동안 기사 본문 전문은 커밋하지 않는다(비공개 아티팩트에만).
  commit_fulltext: false
